# List of Jarvis projects
jarvis_projects:
  - name: "Azure Databricks Data Engineering"
    git_url: "/databricks"
    description: >
      Designed and delivered two production-grade data pipelines on Azure
      Databricks for a fintech client using Medallion Architecture
      (Bronze - Silver - Gold). The first pipeline ingests financial transaction
      data from Azure SQL Database via JDBC and ADLS Gen2 via External Location,
      applies cleaning and enrichment in a silver layer, and produces 14 fraud
      analysis aggregations in a gold layer powering a live AI/BI dashboard.
      The second pipeline uses Delta Live Tables to ingest daily stock data from
      Alpha Vantage API for four equity symbols, computes 7/30/90 day price and
      volume trend metrics, and refreshes a market intelligence dashboard on a
      daily schedule. Both pipelines are orchestrated using Databricks Jobs.
      Encountered and resolved real infrastructure blockers including vCPU quota
      exhaustion, ADF Unity Catalog compatibility limitations, and large nested
      JSON ingestion challenges.
      
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    description: >
      Built a Linux-based monitoring agent to collect CPU and memory usage data,
      persist system metrics in PostgreSQL, and enable historical analysis using
      SQL. Designed database schemas, ingestion scripts, and containerized the
      solution using Docker to support operational visibility.

  - name: "Core Java Applications"
    git_url: "/core_java"
    description: >
      Developed multiple Java backend applications including a grep-style
      command-line tool for efficiently searching large directory structures
      using regular expressions. Focused on clean interfaces, modular design,
      error handling, Maven-based builds, and containerized execution.

  - name: "Python Data Analytics"
    git_url: "/python_data_analytics"
    description: >
      Implemented an end-to-end analytics workflow using PostgreSQL and Python
      to analyze retail transaction data. Produced revenue trends, order and
      cancellation analysis, customer behavior insights, and RFM segmentation
      to support targeted marketing strategies.

  - name: "Databricks PySpark Retail Analytics"
    git_url: "/spark"
    description: >
      Re-implemented the London Gift Shop retail analytics solution using
      Databricks and PySpark to handle larger-scale processing beyond a
      single-machine Pandas workflow. Ingested the retail dataset into
      Unity Catalog as a managed table, performed data validation
      (nulls profiling, cancellation detection, invalid quantity/price checks),
      and built key business insights using PySpark DataFrames and Spark SQL
      validation (invoice-level revenue, monthly KPIs, growth, and customer
      activity insights).

